<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SmartDesk</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      color: #222;
    }
    textarea {
      width: 100%;
      height: 80px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
    }
    .category {
      font-size: 20px;
      font-weight: bold;
    }
    .review {
      color: #b45309;
    }
    .bar-track {
      background: #eee;
      border-radius: 6px;
      height: 12px;
      margin: 10px 0;
    }
    .bar-fill {
      background: #4f46e5;
      height: 12px;
      border-radius: 6px;
    }
    .example {
      padding: 10px;
      border-left: 3px solid #ddd;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>SmartDesk</h1>
  <p>Paste a support ticket and see how it gets routed.</p>

  <textarea id="ticketInput" placeholder="e.g. I noticed a charge I don't recognize on my statement"></textarea>
  <br>
  <button onclick="routeTicket()">Route Ticket</button>

  <div id="result"></div>

  <script>
    async function routeTicket() {
      const text = document.getElementById("ticketInput").value;
      if (!text.trim()) return;

      const response = await fetch("http://127.0.0.1:8000/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      const data = await response.json();
      showResult(data);
    }

    function showResult(data) {
      const confidencePercent = Math.round(data.confidence * 100);

      let html = "";
      if (data.needs_review) {
        html += `<div class="category review">Needs human review</div>`;
      } else {
        html += `<div class="category">${data.category}</div>`;
      }

      html += `
        <div class="bar-track">
          <div class="bar-fill" style="width:${confidencePercent}%"></div>
        </div>
        <p>Confidence: ${confidencePercent}%</p>
        <h3>Nearest past tickets</h3>
      `;

      for (const match of data.nearest) {
        html += `
          <div class="example">
            <strong>${match.category}</strong> (similarity ${match.similarity})<br>
            ${match.text}
          </div>
        `;
      }

      document.getElementById("result").innerHTML = html;
    }
  </script>

</body>
</html>
