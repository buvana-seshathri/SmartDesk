<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SmartDesk</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 4px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 40px;
    }
    .buttons {
      display: flex;
      gap: 20px;
    }
    a.card {
      text-decoration: none;
      color: white;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 30px 50px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      transition: 0.15s;
    }
    a.card:hover {
      background: #334155;
      border-color: #6366f1;
    }
    .subtext {
      display: block;
      font-weight: 400;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h1>SmartDesk</h1>
  <p>AI-powered support ticket routing</p>

  <div class="buttons">
    <a class="card" href="/user">
      Submit a Ticket
      <span class="subtext">Customer view</span>
    </a>
    <a class="card" href="/admin">
      Admin Dashboard
      <span class="subtext">Review queue</span>
    </a>
  </div>

</body>
</html>
