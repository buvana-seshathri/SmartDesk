<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SmartDesk - Review Queue</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      color: #222;
    }
    .item {
      padding: 12px;
      border-left: 3px solid #b45309;
      background: #fffbeb;
      margin-bottom: 10px;
    }
    .meta {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>Review Queue</h1>
  <p>Tickets SmartDesk wasn't confident enough to auto-route.</p>

  <button onclick="loadQueue()">Refresh</button>

  <div id="queue"></div>

  <script>
    async function loadQueue() {
      const response = await fetch("http://127.0.0.1:8000/review-queue");
      const items = await response.json();

      const container = document.getElementById("queue");

      if (items.length === 0) {
        container.innerHTML = "<p>Queue is empty. Nice.</p>";
        return;
      }

      let html = "";
      for (const item of items) {
        html += `
          <div class="item">
            ${item.ticket}
            <div class="meta">confidence ${Math.round(item.confidence * 100)}% &middot; flagged ${item.flagged_at}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    loadQueue();
  </script>

</body>
</html>
